# Score « Trail Shape » (#63) : préparation à l'objectif actif.
#
# Fixture `trail-shape/` : objectif trail (21,1 km, 1 200 m D+, date fixe
# lointaine — voir `tests/evals/fixtures/README.md`, ce cas n'a pas besoin
# d'une course proche, seulement future) et 8 sorties trail relatives (#63,
# `<N>d_trail.md`, offsets 0 à 49 jours) construites pour donner une
# préparation SUFFISANTE mais pas parfaite :
#   - volume hebdomadaire moyen (km-effort ITRA, #35) ≈ 15,9 km/semaine pour
#     une cible ≈ 16,6 (ratio ≈ 0,96) ;
#   - plus longue sortie 18 km pour une cible 21,1 km (ratio ≈ 0,85) ;
#   - D+ max d'une séance 1 000 m pour une cible 600 m (ratio à 1,0, plafonné) ;
#   - aucune donnée de durabilité (#48) : les fichiers d'activité ne portent
#     que le contrat de base (distance/D+/durée), aucun FIT ingéré — la
#     composante est donc OMISE (poids redistribué sur les trois autres),
#     exactement le cas « durabilité manquante -> renormalisation » exigé par
#     #63.
# `python3 scripts/arc_index.py trail-shape` sur cette fixture rend un score
# ≈ 93/100 (voir le calcul dans `arc_trail_shape.py`) — le prompt ne donne
# AUCUN chiffre : l'agent doit lancer la CLI (ou lire `/api/trail-shape`) et
# rapporter ce qu'elle rend, jamais une estimation de tête.
#
# `must_match` : le score doit être cité (nombre proche de 90-96, tolérance
# large pour ne pas verrouiller l'arrondi exact), au moins deux des trois
# composantes éligibles nommées (volume et sortie longue — les deux dont le
# ratio n'est PAS à son plafond, donc les plus probables à être commentées),
# et la durabilité doit être signalée comme absente/non calculée (jamais
# passée sous silence). `must_not_match` refuse un score à deux chiffres rond
# non lié à la fenêtre (ex. « 100/100 » ou « 50 % » inventés) et refuse que la
# durabilité soit présentée comme un chiffre concret (l'agent ne doit pas
# halluciner un pourcentage de fade GAP qu'aucune donnée ne permet de calculer
# sur cette fixture).
id = "trail-shape"
prompt = "Où en est ma préparation « Trail Shape » pour mon objectif actif ? Détaille les composantes du score."
fixture = "trail-shape"

[expect]
must_match = [
  "\\b(9[0-6]|8[5-9])\\b",
  "(volume|km-effort).{0,60}(hebdo|semaine)",
  "(plus longue|sortie longue).{0,40}(18|21)",
  "(durabilit[ée]).{0,80}(pas|aucune|absen|non calcul[ée]|manqu|indisponible|non int[ée]gr[ée]e)",
]
must_not_match = [
  "\\b100\\s*/\\s*100\\b",
  "durabilit[ée].{0,40}\\d{1,2}\\s*%",
]
