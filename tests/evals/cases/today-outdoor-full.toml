# #66 — /today, bilan matinal `full` (défaut), séance du jour en extérieur.
# Fixture `guardrail-ok` : le bilan de `medical/0d_health.md` (aujourd'hui) est
# déjà persisté (HRV/FC de repos/readiness dans la norme, verdict vert) — la
# règle de fraîcheur veut donc qu'aucun outil Garmin ne soit rappelé pour le
# recalculer. Cette commande est en LECTURE SEULE : ni validation, ni push.
id = "today-outdoor-full"
prompt = "/today"
fixture = "guardrail-ok"

[config.language]
responses = "fr"

[expect]
first_line_matches = "^Aujourd'hui\\s*—"
max_words = 130
tools_not_called = [
  "get_hrv_data", "get_rhr_day", "get_training_readiness",
  "schedule_workouts", "schedule_week", "upload_workout",
]
must_match = ["footing|endurance"]
files_absent = ["planning/*_decision_*.md"]
